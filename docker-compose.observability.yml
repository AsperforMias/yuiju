name: yuiju-observability

services:
  loki:
    image: grafana/loki:3.1.1
    container_name: yuiju-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - yuiju-loki-data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    container_name: yuiju-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    depends_on:
      - loki
    volumes:
      - ./observability/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - yuiju-promtail-positions:/tmp
      - ./packages/world/logs:/var/log/yuiju/world:ro
      - ./packages/message/logs:/var/log/yuiju/message:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: yuiju-grafana
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - yuiju-grafana-data:/var/lib/grafana

volumes:
  yuiju-loki-data:
  yuiju-promtail-positions:
  yuiju-grafana-data:
